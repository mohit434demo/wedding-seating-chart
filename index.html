<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#14402f" />
<meta name="description" content="Find your seat for the wedding of Sagar and Krupa, October 17, 2026." />
<title>Sagar &amp; Krupa &mdash; Find Your Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --w-green:       #14402f;
    --w-green-deep:  #0e3123;
    --w-ivory:       #f4f1ea;
    --w-ivory-dim:   rgba(244, 241, 234, 0.80);
    --w-ivory-faint: rgba(244, 241, 234, 0.38);
    --w-veil:        rgba(244, 241, 234, 0.09);
    --w-shadow:      0 18px 48px rgba(0, 0, 0, 0.35);
    --font-script:   "Dancing Script", cursive;
    --font-serif:    "Cormorant Garamond", Georgia, serif;
    --gutter:        40px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-serif);
    background: var(--w-green);
    color: var(--w-ivory);
    -webkit-font-smoothing: antialiased;
  }

  /* Clips the bleeding decorations so they can never widen the page.
     `clip` (not `hidden`) avoids creating a scroll container. */
  .shell { overflow-x: clip; overflow-y: visible; }

  .page {
    position: relative;
    max-width: 1060px;
    margin: 0 auto;
    padding: 34px var(--gutter) 130px;
    min-height: 100vh;
  }

  /* ---------- Decorative ribbon line-art ---------- */
  .deco { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .deco svg {
    position: absolute;
    width: clamp(260px, 34vw, 460px);
    height: auto;
    color: var(--w-ivory);
    opacity: 1;
  }
  .deco .tl { top: -70px;    left: -150px; }
  .deco .tr { top: -110px;   right: -160px; transform: scaleX(-1); }
  .deco .bl { bottom: -30px; left: -170px;  transform: scaleY(-1); }
  .deco .br { bottom: -90px; right: -150px; transform: scale(-1, -1); }

  /* Mid-page side accents - they bleed off the edges behind the grid */
  .deco .ml, .deco .mr { width: clamp(180px, 22vw, 300px); opacity: 0.9; }
  .deco .ml { top: 46%; left: -185px;  transform: translateY(-50%) rotate(-8deg); }
  .deco .mr { top: 62%; right: -185px; transform: translateY(-50%) scaleX(-1) rotate(-8deg); }
  @media (max-width: 1180px) { .deco .ml, .deco .mr { display: none; } }

  /* ---------- Header ---------- */
  header { position: relative; z-index: 1; text-align: center; padding: 26px 0 4px; }
  .find-seat {
    font-family: var(--font-script);
    font-weight: 600;
    font-size: clamp(3rem, 12vw, 7.4rem);
    line-height: 1.12;
    margin: 0;
    padding: 0 0.12em 0.08em;   /* room for the descender + swash tail */
    color: var(--w-ivory);
  }
  .eyebrow {
    font-size: clamp(0.62rem, 2.2vw, 0.78rem);
    letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--w-ivory-faint);
    margin: 0 0 6px; padding-left: 0.42em;
  }

  /* ---------- Search (sticky) ---------- */
  .search-dock {
    position: sticky; top: 0; z-index: 6;
    margin: 22px calc(var(--gutter) * -1) 0;
    padding: 12px var(--gutter) 14px;
    background: var(--w-green);
  }
  .search-dock::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px;
    background: linear-gradient(var(--w-green), rgba(20, 64, 47, 0));
    transform: translateY(100%); pointer-events: none;
  }
  .search-box {
    display: flex; align-items: center; gap: 12px;
    max-width: 560px; margin: 0 auto;
    background: var(--w-veil);
    border: 1.5px solid rgba(244, 241, 234, 0.45);
    border-radius: 999px;
    padding: 13px 20px;
    transition: border-color .2s, background .2s;
  }
  .search-box:focus-within {
    border-color: var(--w-ivory);
    background: rgba(244, 241, 234, 0.14);
  }
  .search-box svg { flex: 0 0 auto; color: var(--w-ivory-dim); }
  .search-box input {
    border: 0; outline: 0; background: transparent; width: 100%;
    font-family: var(--font-serif);
    font-size: 1.25rem;          /* >=16px keeps iOS from zooming on focus */
    color: var(--w-ivory);
    min-width: 0;
  }
  .search-box input::placeholder { color: rgba(244, 241, 234, 0.52); }
  .clear-btn {
    border: 0; background: transparent; cursor: pointer; color: var(--w-ivory-dim);
    font-size: 1.6rem; line-height: 1; padding: 0 4px; display: none;
    min-width: 30px; min-height: 30px;
  }

  .result { position: relative; z-index: 1; max-width: 560px; margin: 16px auto 0; display: none; }
  .result-inner {
    background: rgba(244, 241, 234, 0.1);
    border: 1px solid rgba(244, 241, 234, 0.42);
    border-radius: 18px; padding: 18px 22px; text-align: center;
  }
  .result-name { font-size: 1.45rem; font-weight: 500; letter-spacing: 0.02em; }
  .result-table {
    font-family: var(--font-script); font-weight: 600; font-size: 2.3rem;
    line-height: 1.2; margin-top: 4px; color: var(--w-ivory);
  }
  .result .companions { margin-top: 8px; font-size: 1.05rem; color: var(--w-ivory-dim); }
  .result.none .result-inner { background: transparent; border-style: dashed; }
  .result.none .result-name { color: var(--w-ivory-dim); }

  .rule {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    max-width: 340px; margin: 34px auto 30px;
    color: var(--w-ivory-faint);
  }
  .rule::before, .rule::after {
    content: ""; height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, rgba(244,241,234,0.5), transparent);
  }
  .rule span { font-size: 0.72rem; letter-spacing: 0.3em; }

  /* ---------- Tables grid ---------- */
  .tables {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 34px 26px;
  }
  .table-block {
    position: relative;
    border-radius: 14px; padding: 14px 16px;
    border: 1px solid transparent;
    background: rgba(14, 49, 35, 0.55);
    backdrop-filter: blur(2px);
    scroll-margin-top: 104px;
    transition: background .25s, border-color .25s, opacity .25s;
  }
  .table-block.dim { opacity: 0.2; }
  .table-block.match {
    background: rgba(244, 241, 234, 0.12);
    border-color: rgba(244, 241, 234, 0.6);
  }
  .table-title {
    font-size: clamp(1.45rem, 3.4vw, 1.9rem);
    font-weight: 300; letter-spacing: 0.01em;
    font-variant-numeric: lining-nums;
    margin: 0 0 10px; padding-bottom: 8px;
    color: var(--w-ivory);
    border-bottom: 1px solid rgba(244, 241, 234, 0.18);
  }
  .guest {
    font-size: 1.1rem; line-height: 1.55;
    color: var(--w-ivory-dim); font-weight: 300;
  }
  .guest.hit { color: var(--w-ivory); font-weight: 500; }
  mark { background: rgba(244, 241, 234, 0.28); color: inherit; padding: 0 2px; border-radius: 3px; }

  /* ---------- Footer ---------- */
  footer {
    position: relative; z-index: 1; text-align: center;
    margin: 76px auto 0; max-width: 720px;
    padding: 40px 28px 34px;
  }
  /* Thin ivory corner brackets frame the names */
  footer::before, footer::after {
    content: ""; position: absolute; width: 58px; height: 58px;
    border: 1px solid rgba(244, 241, 234, 0.42);
  }
  footer::before { top: 0; left: 0;  border-right: 0; border-bottom: 0; border-radius: 4px 0 0 0; }
  footer::after  { bottom: 0; right: 0; border-left: 0; border-top: 0;  border-radius: 0 0 4px 0; }

  .couple {
    --track: 0.16em;
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 0.08em var(--track);
    font-weight: 300;
    font-size: clamp(1.9rem, 7.4vw, 3.9rem);
    letter-spacing: normal;
    margin: 0; line-height: 1.16;
    text-transform: uppercase;
  }
  /* letter-spacing adds a trailing gap after the last glyph, which shoves
     the script "and" off-centre. Cancel it, then nudge back by half the
     tracking so the space reads equal on both sides at any size. */
  .couple .nm {
    display: inline-block;
    letter-spacing: var(--track);
    margin-right: calc(-1 * var(--track));
  }
  .couple .amp {
    font-family: var(--font-script); font-weight: 500;
    text-transform: none; letter-spacing: normal;
    font-size: 0.78em; line-height: 1;
    color: var(--w-ivory-dim);
    /* half the tracking, converted from couple-em into amp-em (÷0.78),
       plus a baseline drop so the script sits with the uppercase serif */
    transform: translate(0.103em, 0.06em);
  }
  .wed-date {
    font-size: clamp(0.92rem, 2.7vw, 1.2rem);
    font-weight: 400; color: var(--w-ivory-dim);
    font-variant-numeric: lining-nums;
    margin-top: 16px; letter-spacing: 0.28em;
    text-transform: uppercase;
  }
  .venue-note {
    margin-top: 10px; font-size: 0.86rem;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--w-ivory-faint);
  }

  /* ---------- QR button + modal ---------- */
  .qr-fab {
    position: fixed; right: 20px; z-index: 20;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--w-ivory); color: var(--w-green-deep);
    border: 0; border-radius: 999px; cursor: pointer;
    padding: 12px 20px;
    font-family: var(--font-serif); font-size: 1.05rem;
    font-weight: 500; letter-spacing: 0.04em;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .qr-fab:hover { background: #fff; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(8, 26, 19, 0.72);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--w-green-deep); color: var(--w-ivory);
    border: 1.5px solid rgba(244, 241, 234, 0.45);
    border-radius: 18px; max-width: 360px; width: 100%;
    padding: 28px 26px 22px; text-align: center;
    box-shadow: var(--w-shadow); position: relative;
  }
  .modal h3 {
    font-family: var(--font-script); font-weight: 600;
    font-size: 2.1rem; margin: 0 0 6px; line-height: 1.15;
  }
  .modal p { color: var(--w-ivory-dim); font-size: 1.05rem; margin: 0 0 16px; }
  #qrcode { display: flex; justify-content: center; }
  #qrcode img {
    width: 220px; height: 220px; border-radius: 10px;
    border: 1.5px solid rgba(244, 241, 234, 0.5); background: #fff; padding: 6px;
  }
  .modal .url {
    margin-top: 14px; font-size: 0.8rem; color: var(--w-ivory-faint);
    word-break: break-all; font-family: Consolas, monospace;
  }
  .modal-close {
    position: absolute; top: 8px; right: 12px; border: 0; background: transparent;
    font-size: 1.8rem; cursor: pointer; color: var(--w-ivory-dim); line-height: 1;
    min-width: 40px; min-height: 40px;
  }
  .modal .hint { font-size: 0.82rem; color: var(--w-ivory-faint); margin-top: 10px; }

  /* =========================================================
     TABLET
     ========================================================= */
  @media (max-width: 900px) {
    :root { --gutter: 28px; }
    .tables { grid-template-columns: repeat(3, 1fr); gap: 28px 20px; }
  }

  /* =========================================================
     PHONE
     ========================================================= */
  @media (max-width: 640px) {
    :root { --gutter: 16px; }

    .page { padding: 12px var(--gutter) 90px; min-height: 0; }

    header { padding: 8px 0 2px; }
    .eyebrow { font-size: 0.7rem; letter-spacing: 0.38em; }
    .find-seat { font-size: clamp(2.6rem, 13.2vw, 4.6rem); white-space: nowrap; }

    /* Decoration stays bold and ivory, pushed clear of the headline */
    .deco svg { width: clamp(220px, 64vw, 320px); opacity: 0.9; }
    .deco .tl { top: -10px;    left: -152px; }
    .deco .tr { top: -24px;    right: -152px; }
    .deco .bl { bottom: 40px;  left: -162px; }
    .deco .br { bottom: -50px; right: -150px; }

    .search-dock { margin-top: 16px; padding: 10px var(--gutter) 12px; }
    .search-box { padding: 14px 18px; gap: 10px; }
    .search-box input { font-size: 1.2rem; }

    .result { margin-top: 12px; }
    .result-inner { padding: 16px 16px; border-radius: 16px; }
    .result-name { font-size: 1.34rem; }
    .result-table { font-size: 2.15rem; }
    .result .companions { font-size: 1rem; }

    .rule { margin: 24px auto 20px; }

    /* Two readable columns beats one very long scroll */
    .tables { grid-template-columns: repeat(2, 1fr); gap: 16px 11px; }
    .table-block {
      padding: 13px 12px 15px;
      border-color: rgba(244, 241, 234, 0.2);
      background: rgba(14, 49, 35, 0.72);
    }
    .table-block.dim { opacity: 0.3; }
    .table-title { font-size: 1.42rem; margin-bottom: 9px; padding-bottom: 8px; }
    .guest { font-size: 1.09rem; line-height: 1.5; }

    footer { margin-top: 48px; padding: 32px 18px 28px; }
    footer::before, footer::after { width: 42px; height: 42px; }
    .couple { --track: 0.2em; }
    .wed-date { letter-spacing: 0.22em; margin-top: 13px; }
    .venue-note { letter-spacing: 0.18em; }

    /* On a phone you are already holding the link - shrink the QR to an icon */
    .qr-fab {
      right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      padding: 13px; border-radius: 50%; gap: 0;
    }
    .qr-fab .qr-label { display: none; }
  }

  @media (max-width: 390px) {
    .tables { gap: 14px 9px; }
    .table-block { padding: 12px 10px 14px; }
    .table-title { font-size: 1.32rem; }
    .guest { font-size: 1.03rem; }
  }

  @media (max-width: 340px) {
    .tables { grid-template-columns: 1fr; gap: 12px; }
    .find-seat { font-size: 12.8vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <div class="shell">
  <div class="page">
    <div class="deco" aria-hidden="true">
      <svg class="tl" viewBox="0 0 420 400" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><use href="#ribbonA" /></svg>
      <svg class="tr" viewBox="0 0 420 400" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><use href="#ribbonB" /></svg>
      <svg class="ml" viewBox="0 0 420 400" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><use href="#ribbonC" /></svg>
      <svg class="mr" viewBox="0 0 420 400" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><use href="#ribbonC" /></svg>
      <svg class="bl" viewBox="0 0 420 400" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><use href="#ribbonB" /></svg>
      <svg class="br" viewBox="0 0 420 400" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><use href="#ribbonA" /></svg>
    </div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <path id="ribbonA" d="M-40 92C34 34 108 74 104 140c-4 66-92 74-104 18-12-56 78-104 152-74 74 30 62 128 4 160-58 32-136-10-150-78-14-68 64-132 148-118 84 14 128 96 120 176"/>
        <path id="ribbonB" d="M-40 250C24 178 6 92 82 62c76-30 130 44 96 96-34 52-116 26-104-32 12-58 112-70 178-10 66 60 62 168 6 230"/>
        <path id="ribbonC" d="M-60 40C20 66 96 44 122 104c26 60-42 110-90 74-48-36-2-114 66-104 68 10 102 96 70 170-32 74-138 96-210 52"/>
      </defs>
    </svg>

    <header>
      <div class="eyebrow">Please</div>
      <h1 class="find-seat">Find Your Seat</h1>
    </header>

    <div class="search-dock">
      <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search" type="search" enterkeyhint="search" placeholder="Type your name..." aria-label="Search for your name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" />
        <button class="clear-btn" id="clear" type="button" aria-label="Clear search">&times;</button>
      </div>
    </div>

    <div class="result" id="result" role="status" aria-live="polite">
      <div class="result-inner">
        <div class="result-name" id="resultName"></div>
        <div class="result-table" id="resultTable"></div>
        <div class="companions" id="resultCompanions"></div>
      </div>
    </div>

    <div class="rule"><span>&#9670;</span></div>

    <div class="tables" id="tables"></div>

    <footer>
      <div class="couple">
        <span class="nm">Sagar</span><span class="amp">and</span><span class="nm">Krupa</span>
      </div>
      <div class="wed-date">October 17, 2026</div>
      <div class="venue-note">Reception</div>
    </footer>
  </div>
  </div>

  <button class="qr-fab" id="qrFab" type="button" aria-label="Show QR code">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm2 2h3v2h-3v-2zm-2 2h2v2h-2v-2zm2 2h3v3h-2v-1h-1v-2zm-4 0h2v3h-2v-3z"/></svg>
    <span class="qr-label">Show QR code</span>
  </button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-label="QR code">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
      <h3>Scan to find your seat</h3>
      <p>Point your phone camera here to open this seating chart.</p>
      <div id="qrcode"></div>
      <div class="url" id="qrUrl"></div>
      <div class="hint">Tip: host this page online, then reopen to get a shareable QR.</div>
    </div>
  </div>

<script>
  const TABLES = [
    { n: 1,  guests: ["Tommy Cochran","Charlotte Cochran","Brianna Cochran","Jordan Bautista","Hope Bautista","Charity Johns"] },
    { n: 2,  guests: ["Alijah Lozano","Moriah Lozano","Terry Lozano","Alejandra Marks","Ahmad Marks","Nicolas Simpson"] },
    { n: 3,  guests: ["Malachi Kim","Waylon Howell","Makai Estrada","Trevor Donovan","Avery Lynch","Ali Stanley"] },
    { n: 4,  guests: ["Callum Shea","Kaylin Shea","Leyla Merritt","Deon Merritt","Deanna Merritt","Brycen Shea"] },
    { n: 5,  guests: ["Catherina George","Louis Tran","Natalie Tran","Royce Boyd","Keshawn Boyd","Riley Boyd"] },
    { n: 6,  guests: ["Gunner Levine","Dana Levine","Kingston Mercer","Branson Mercer","Milton Mercer","Camila Mercer"] },
    { n: 7,  guests: ["Tommy Cochran","Charlotte Cochran","Brianna Cochran","Jordan Bautista","Hope Bautista","Charity Johns"] },
    { n: 8,  guests: ["Alijah Lozano","Moriah Lozano","Terry Lozano","Alejandra Marks","Ahmad Marks","Nicolas Simpson"] },
    { n: 9,  guests: ["Malachi Kim","Waylon Howell","Makai Estrada","Trevor Donovan","Avery Lynch","Ali Stanley"] },
    { n: 10, guests: ["Callum Shea","Kaylin Shea","Leyla Merritt","Deon Merritt","Deanna Merritt","Brycen Shea"] },
    { n: 11, guests: ["Alijah Lozano","Moriah Lozano","Terry Lozano","Alejandra Marks","Ahmad Marks","Nicolas Simpson"] },
    { n: 12, guests: ["Gunner Levine","Dana Levine","Kingston Mercer","Branson Mercer","Milton Mercer","Camila Mercer"] },
  ];

  const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();

  const tablesEl = document.getElementById("tables");
  TABLES.forEach(t => {
    const block = document.createElement("div");
    block.className = "table-block"; block.dataset.table = t.n;
    let html = `<div class="table-title">Table ${t.n}</div>`;
    t.guests.forEach(g => { html += `<div class="guest" data-name="${norm(g)}">${g}</div>`; });
    block.innerHTML = html; tablesEl.appendChild(block);
  });

  const guestEls  = Array.from(document.querySelectorAll(".guest"));
  const blockEls  = Array.from(document.querySelectorAll(".table-block"));
  const searchEl  = document.getElementById("search");
  const clearEl   = document.getElementById("clear");
  const resultEl  = document.getElementById("result");
  const resultName = document.getElementById("resultName");
  const resultTable = document.getElementById("resultTable");
  const resultCompanions = document.getElementById("resultCompanions");

  function reset() {
    guestEls.forEach(el => { el.classList.remove("hit"); el.innerHTML = el.textContent; });
    blockEls.forEach(el => el.classList.remove("dim", "match"));
    resultEl.className = "result"; resultEl.style.display = "none";
  }
  function highlight(el, q) {
    const text = el.textContent; const i = norm(text).indexOf(q);
    if (i < 0) { el.innerHTML = text; return; }
    el.innerHTML = text.slice(0, i) + "<mark>" + text.slice(i, i + q.length) + "</mark>" + text.slice(i + q.length);
  }

  let scrollTimer = null;
  function scrollToMatch() {
    const first = document.querySelector(".table-block.match");
    if (!first) return;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      first.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 450);
  }

  function onSearch() {
    const raw = searchEl.value; const q = norm(raw);
    clearEl.style.display = raw ? "block" : "none";
    clearTimeout(scrollTimer);
    if (!q) { reset(); return; }

    const matches = guestEls.filter(el => el.dataset.name.includes(q));
    const matchTables = new Set(matches.map(el => Number(el.closest(".table-block").dataset.table)));
    guestEls.forEach(el => { el.classList.remove("hit"); el.innerHTML = el.textContent; });
    blockEls.forEach(el => {
      const isMatch = matchTables.has(Number(el.dataset.table));
      el.classList.toggle("match", isMatch);
      el.classList.toggle("dim", !isMatch && matchTables.size > 0);
    });
    matches.forEach(el => { el.classList.add("hit"); highlight(el, q); });

    const exact = matches.filter(el => el.dataset.name === q);
    const sortedTables = [...matchTables].sort((a, b) => a - b);

    if (matches.length === 0) {
      resultEl.className = "result none"; resultEl.style.display = "block";
      resultName.textContent = `No guest found for "${raw.trim()}"`;
      resultTable.textContent = "";
      resultCompanions.textContent = "Please check the spelling or ask an usher.";
      return;
    }

    resultEl.className = "result"; resultEl.style.display = "block";

    if (matches.length === 1) {
      const el = matches[0];
      const tableNo = Number(el.closest(".table-block").dataset.table);
      const guests = (TABLES.find(t => t.n === tableNo) || { guests: [] }).guests;
      resultName.textContent = el.textContent;
      resultTable.textContent = `You're at Table ${tableNo}`;
      const others = guests.filter(g => norm(g) !== el.dataset.name);
      resultCompanions.textContent = others.length ? "Seated with: " + others.join(", ") : "";
      scrollToMatch();
    } else if (exact.length === matches.length) {
      resultName.textContent = exact[0].textContent;
      resultTable.textContent = `Tables ${sortedTables.join(" & ")}`;
      resultCompanions.textContent = "This name is listed at more than one table. Please check with an usher.";
    } else {
      resultName.textContent = `${matches.length} matches`;
      resultTable.textContent = sortedTables.length === 1
        ? `All at Table ${sortedTables[0]}`
        : `Tables ${sortedTables.join(", ")}`;
      resultCompanions.textContent = "Keep typing to narrow it down.";
    }
  }
  searchEl.addEventListener("input", onSearch);
  searchEl.addEventListener("search", onSearch);
  searchEl.addEventListener("keydown", (e) => { if (e.key === "Enter") searchEl.blur(); });
  clearEl.addEventListener("click", () => { searchEl.value = ""; searchEl.focus(); onSearch(); });

  const modalOverlay = document.getElementById("modalOverlay");
  document.getElementById("qrFab").addEventListener("click", () => {
    const url = window.location.href.split("?")[0];
    const qrBox = document.getElementById("qrcode");
    document.getElementById("qrUrl").textContent = url;
    try {
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      qrBox.innerHTML = qr.createImgTag(6, 8);
    } catch (e) { qrBox.textContent = "Unable to render QR (no internet?)."; }
    modalOverlay.classList.add("open");
  });
  document.getElementById("modalClose").addEventListener("click", () => modalOverlay.classList.remove("open"));
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove("open"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") modalOverlay.classList.remove("open"); });
</script>
</body>
</html>
