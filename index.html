<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sagar &amp; Krupa — Find Your Seat</title>
<script>
  (() => {
    // This wedding page is intentionally light; honor an explicit override only.
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    document.documentElement.setAttribute("data-theme", param || "light");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marcellus&family=Rozha+One&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --cp-bg: #f7f4ef;
    --cp-surface: #ffffff;
    --cp-surface-soft: #f5f5f5;
    --cp-border: #dedede;
    --cp-text: #242424;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);

    /* Light indigo block-print palette */
    --w-paper: #ffffff;
    --w-paper-2: #fdfcf9;
    --w-ink: #2c2c2c;
    --w-sub: #6b6b78;
    --w-indigo: #2a337e;
    --w-indigo-deep: #1d2560;
    --w-indigo-soft: #eef0fb;
    --w-line: #d9dcef;
    --w-accent: #2a337e;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #3d3b3a;
    --cp-surface: #292929;
    --cp-surface-soft: #2e2e2e;
    --cp-border: #474747;
    --cp-text: #dedede;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);

    --w-paper: #1c1e33;
    --w-paper-2: #191b2c;
    --w-ink: #e9e9f2;
    --w-sub: #a7a9c2;
    --w-indigo: #9aa4e6;
    --w-indigo-deep: #b6bdf0;
    --w-indigo-soft: rgba(154, 164, 230, 0.14);
    --w-line: #34375a;
    --w-accent: #9aa4e6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", "Segoe UI", Georgia, serif;
    background: var(--cp-bg);
    color: var(--w-ink);
    -webkit-font-smoothing: antialiased;
    padding: 26px 14px 100px;
  }

  .card {
    max-width: 920px; margin: 0 auto;
    background: linear-gradient(180deg, var(--w-paper) 0%, var(--w-paper-2) 100%);
    border-radius: 14px; box-shadow: var(--cp-shadow);
    position: relative; overflow: hidden;
  }
  .frame { position: relative; padding: 8px 26px 14px; }
  .inner-rule {
    position: absolute; inset: 74px 14px 74px;
    border: 1px solid var(--w-line); border-radius: 8px; pointer-events: none; z-index: 0;
  }

  /* Paisley block-print border band */
  .band { display: block; width: 100%; height: 66px; color: var(--w-indigo); }
  .band.bottom { transform: scaleY(-1); }
  @media (max-width: 560px) { .band { height: 50px; } .inner-rule { inset: 58px 8px 58px; } }

  header { text-align: center; position: relative; z-index: 1; padding-top: 14px; }
  .top-orn {
    color: var(--w-indigo); font-family: "Marcellus", serif;
    font-size: 0.95rem; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 4px;
  }
  .welcome {
    font-family: "Great Vibes", cursive;
    font-size: clamp(3.2rem, 10vw, 5.6rem); line-height: 0.9;
    color: var(--w-indigo); margin: 0 0 4px; font-weight: 400;
  }
  .to-wedding {
    letter-spacing: 0.34em; font-size: clamp(0.76rem, 2.5vw, 0.95rem);
    font-weight: 600; text-transform: uppercase; color: var(--w-sub); margin: 6px 0 6px;
  }
  .couple {
    font-family: "Rozha One", serif; font-weight: 400; letter-spacing: 0.02em;
    font-size: clamp(1.9rem, 7.5vw, 3.1rem); margin: 2px 0; color: var(--w-indigo-deep); line-height: 1.05;
  }
  .couple .amp { font-family: "Great Vibes", cursive; font-size: 0.95em; color: var(--w-indigo); }
  .find-seat {
    font-family: "Great Vibes", cursive; font-size: clamp(1.5rem, 5vw, 2.1rem);
    color: var(--w-indigo); margin: 2px 0 2px;
  }
  .flourish {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 14px auto 22px; max-width: 320px; color: var(--w-indigo);
  }
  .flourish::before, .flourish::after {
    content: ""; height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, var(--w-line), transparent);
  }
  .flourish span { font-size: 1rem; opacity: 0.9; }

  /* Search */
  .search-wrap { position: relative; z-index: 1; max-width: 540px; margin: 0 auto 8px; }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--cp-surface); border: 1.5px solid var(--w-indigo);
    border-radius: 999px; padding: 12px 18px;
    box-shadow: 0 4px 14px rgba(42,51,126,0.12);
  }
  .search-box svg { flex: 0 0 auto; color: var(--w-indigo); }
  .search-box input {
    border: 0; outline: 0; background: transparent;
    font-family: "Cormorant Garamond", serif; font-size: 1.25rem; width: 100%; color: var(--w-ink);
  }
  .search-box input::placeholder { color: var(--w-sub); opacity: 0.85; }
  .clear-btn {
    border: 0; background: transparent; cursor: pointer; color: var(--w-sub);
    font-size: 1.4rem; line-height: 1; padding: 0 2px; display: none;
  }

  .result { max-width: 540px; margin: 12px auto 0; z-index: 1; position: relative; display: none; }
  .result-inner {
    background: var(--w-indigo-soft); border: 1px solid var(--w-indigo);
    border-radius: 14px; padding: 16px 20px; text-align: center;
  }
  .result-name { font-size: 1.5rem; font-weight: 600; color: var(--w-indigo-deep); }
  .result-table { font-family: "Great Vibes", cursive; font-size: 1.95rem; color: var(--w-indigo); margin-top: 2px; }
  .result.none .result-inner { background: var(--cp-surface-soft); border-color: var(--w-line); }
  .result.none .result-name { color: var(--w-sub); }
  .result .companions { margin-top: 8px; font-size: 1.05rem; color: var(--w-sub); }

  /* Tables grid */
  .tables { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 20px; position: relative; z-index: 1; margin-top: 8px; }
  @media (max-width: 680px) { .tables { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .tables { grid-template-columns: 1fr; } }

  .table-block {
    text-align: center; border-radius: 12px; padding: 12px 8px;
    transition: background .25s, box-shadow .25s, opacity .25s; border: 1px solid transparent;
  }
  .table-block.dim { opacity: 0.25; }
  .table-block.match { background: var(--w-indigo-soft); box-shadow: 0 0 0 1.5px var(--w-indigo); border-color: var(--w-indigo); }
  .table-title { font-family: "Rozha One", serif; font-size: 1.35rem; color: var(--w-indigo-deep); margin-bottom: 8px; display: inline-block; }
  .table-title::after { content: "❁"; display: block; color: var(--w-indigo); font-size: 0.75rem; margin-top: 2px; opacity: 0.7; }
  .guest { font-size: 1.12rem; color: var(--w-ink); line-height: 1.55; }
  .guest.hit { color: var(--w-indigo-deep); font-weight: 600; }
  mark { background: rgba(42,51,126,0.16); color: inherit; padding: 0 2px; border-radius: 3px; }

  /* QR button + modal */
  .qr-fab {
    position: fixed; bottom: 20px; right: 20px; z-index: 20;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--w-indigo); color: #fff; border: 0; border-radius: 999px; cursor: pointer;
    padding: 12px 18px; font-family: "Marcellus", serif; font-size: 1.02rem; letter-spacing: .03em;
    box-shadow: 0 8px 24px rgba(42,51,126,0.3);
  }
  .qr-fab:hover { background: var(--w-indigo-deep); }
  html[data-theme="dark"] .qr-fab { color: #14162a; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,22,42,0.55); display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--w-paper); color: var(--w-ink); border: 1.5px solid var(--w-indigo);
    border-radius: 16px; max-width: 360px; width: 100%; padding: 26px 26px 22px; text-align: center;
    box-shadow: var(--cp-shadow); position: relative;
  }
  .modal h3 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: 2rem; margin: 0 0 4px; color: var(--w-indigo); }
  .modal p { color: var(--w-sub); font-size: 1.02rem; margin: 0 0 16px; }
  #qrcode { display: flex; justify-content: center; }
  #qrcode img { width: 220px; height: 220px; border-radius: 10px; border: 1.5px solid var(--w-indigo); background:#fff; padding:6px; }
  .modal .url { margin-top: 14px; font-size: 0.82rem; color: var(--w-sub); word-break: break-all; font-family: Consolas, monospace; }
  .modal-close { position: absolute; top: 10px; right: 12px; border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--w-sub); line-height: 1; }
  .modal .hint { font-size: 0.8rem; color: var(--w-sub); margin-top: 10px; }
</style>
</head>
<body>
  <!-- Reusable paisley / floral block-print band -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="paisleyBand" x="0" y="0" width="150" height="66" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <!-- scallop arches -->
          <path d="M0 12 Q25 34 50 12 Q75 34 100 12 Q125 34 150 12"/>
          <!-- paisley (buta) centered -->
          <path d="M75 30 C 54 30 46 50 55 64 C 61 74 78 75 84 64 C 88 56 83 48 74 50 C 68 51 67 58 72 60"/>
          <path d="M74 36 C 59 37 52 51 57 63 C 60 70 73 71 80 63"/>
          <!-- paisley center bloom -->
          <circle cx="65" cy="49" r="3.4"/>
        </g>
        <g fill="currentColor" stroke="none">
          <!-- cusp dots -->
          <circle cx="0" cy="10" r="1.7"/><circle cx="50" cy="10" r="1.7"/><circle cx="100" cy="10" r="1.7"/><circle cx="150" cy="10" r="1.7"/>
          <circle cx="25" cy="24" r="1.3"/><circle cx="75" cy="24" r="1.3"/><circle cx="125" cy="24" r="1.3"/>
          <!-- paisley fringe dots -->
          <circle cx="53" cy="49" r="1.3"/><circle cx="51" cy="56" r="1.3"/><circle cx="53" cy="63" r="1.3"/><circle cx="59" cy="69" r="1.3"/>
          <circle cx="65" cy="49" r="1"/>
          <!-- small florets left & right -->
          <g><circle cx="20" cy="50" r="1.5"/><circle cx="20" cy="44" r="1.4"/><circle cx="26" cy="48" r="1.4"/><circle cx="24" cy="55" r="1.4"/><circle cx="16" cy="55" r="1.4"/><circle cx="14" cy="48" r="1.4"/></g>
          <g><circle cx="130" cy="50" r="1.5"/><circle cx="130" cy="44" r="1.4"/><circle cx="136" cy="48" r="1.4"/><circle cx="134" cy="55" r="1.4"/><circle cx="124" cy="55" r="1.4"/><circle cx="122" cy="48" r="1.4"/></g>
          <!-- scatter -->
          <circle cx="40" cy="42" r="1.1"/><circle cx="110" cy="42" r="1.1"/><circle cx="95" cy="62" r="1.1"/>
        </g>
      </pattern>
    </defs>
  </svg>

  <div class="card">
    <svg class="band top" preserveAspectRatio="none" aria-hidden="true"><rect width="100%" height="100%" fill="url(#paisleyBand)"/></svg>
    <div class="frame">
      <div class="inner-rule"></div>

      <header>
        <div class="top-orn">Shubh Vivah</div>
        <h1 class="welcome">Welcome</h1>
        <div class="to-wedding">To the wedding of</div>
        <div class="couple">Sagar <span class="amp">&amp;</span> Krupa</div>
        <div class="find-seat">please find your seat</div>
      </header>

      <div class="flourish"><span>&#10086;</span></div>

      <div class="search-wrap">
        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search" type="text" placeholder="Type your name to find your table..." autocomplete="off" spellcheck="false" />
          <button class="clear-btn" id="clear" aria-label="Clear">&times;</button>
        </div>
      </div>

      <div class="result" id="result">
        <div class="result-inner">
          <div class="result-name" id="resultName"></div>
          <div class="result-table" id="resultTable"></div>
          <div class="companions" id="resultCompanions"></div>
        </div>
      </div>

      <div class="flourish"><span>&#10022;</span></div>

      <div class="tables" id="tables"></div>
    </div>
    <svg class="band bottom" preserveAspectRatio="none" aria-hidden="true"><rect width="100%" height="100%" fill="url(#paisleyBand)"/></svg>
  </div>

  <button class="qr-fab" id="qrFab">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm2 2h3v2h-3v-2zm-2 2h2v2h-2v-2zm2 2h3v3h-2v-1h-1v-2zm-4 0h2v3h-2v-3z"/></svg>
    Show QR code
  </button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <h3>Scan to find your seat</h3>
      <p>Point your phone camera here to open this seating chart.</p>
      <div id="qrcode"></div>
      <div class="url" id="qrUrl"></div>
      <div class="hint">Tip: host this page online, then reopen to get a shareable QR.</div>
    </div>
  </div>

<script>
  const TABLES = [
    { n: 1, guests: ["Paul Nolan","Steven McLean","Madeleine Manning","Olivia Graham","Carolyn Kelly","Justin Jones"] },
    { n: 2, guests: ["Jed Sparks","Anne Vargas","Lorene Rollins","Carter Jackson","Marcelino Beasley","Erick Fleming"] },
    { n: 3, guests: ["Tasha Morse","David Odonnell","Pearl Mullins","Therese Paul","Tobias Sweeney","Alyce Ramirez"] },
    { n: 4, guests: ["Jeri Tucker","Natalia Carter","Cherry David","Fay Parker","Margarito Andrade","Brenton Booth"] },
    { n: 5, guests: ["Young Levy","Terry Mann","Virgilio Estes","Stacie Benson","Antony Owen","Richie Hart"] },
    { n: 6, guests: ["Lavern Lutz","Salvatore Acosta","Kris Sellers","Cornelia Cooper","Brendan Peck","Sandy Merritt"] },
    { n: 7, guests: ["Hilton Hill","Claudette Graham","Sherry Hopkins","Wallace Russo","Latoya Lee","Henry Cline"] },
    { n: 8, guests: ["Ginger Johns","Lewis Baldwin","Allison Burch","Katy Bailey","Kerri Matthews","Kendra Ponce"] },
    { n: 9, guests: ["Monte Lin","Lynn Frost","Pamela Cooke","Mack Figueroa","Benedict Zimmerman","Pansy Novak","Orville Guerra"] },
  ];

  const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();

  const tablesEl = document.getElementById("tables");
  TABLES.forEach(t => {
    const block = document.createElement("div");
    block.className = "table-block"; block.dataset.table = t.n;
    let html = `<div class="table-title">Table ${t.n}</div>`;
    t.guests.forEach(g => { html += `<div class="guest" data-name="${norm(g)}">${g}</div>`; });
    block.innerHTML = html; tablesEl.appendChild(block);
  });

  const guestEls = Array.from(document.querySelectorAll(".guest"));
  const blockEls = Array.from(document.querySelectorAll(".table-block"));
  const searchEl = document.getElementById("search");
  const clearEl = document.getElementById("clear");
  const resultEl = document.getElementById("result");
  const resultName = document.getElementById("resultName");
  const resultTable = document.getElementById("resultTable");
  const resultCompanions = document.getElementById("resultCompanions");

  function findGuest(name) {
    for (const t of TABLES) for (const g of t.guests)
      if (norm(g) === name) return { table: t.n, name: g, guests: t.guests };
    return null;
  }
  function reset() {
    guestEls.forEach(el => { el.classList.remove("hit"); el.innerHTML = el.textContent; });
    blockEls.forEach(el => el.classList.remove("dim", "match"));
    resultEl.className = "result"; resultEl.style.display = "none";
  }
  function highlight(el, q) {
    const text = el.textContent; const i = norm(text).indexOf(q);
    if (i < 0) { el.innerHTML = text; return; }
    el.innerHTML = text.slice(0, i) + "<mark>" + text.slice(i, i + q.length) + "</mark>" + text.slice(i + q.length);
  }
  function onSearch() {
    const raw = searchEl.value; const q = norm(raw);
    clearEl.style.display = raw ? "block" : "none";
    if (!q) { reset(); return; }
    const matches = guestEls.filter(el => el.dataset.name.includes(q));
    const matchTables = new Set(matches.map(el => Number(el.closest(".table-block").dataset.table)));
    guestEls.forEach(el => { el.classList.remove("hit"); el.innerHTML = el.textContent; });
    blockEls.forEach(el => {
      const isMatch = matchTables.has(Number(el.dataset.table));
      el.classList.toggle("match", isMatch);
      el.classList.toggle("dim", !isMatch && matchTables.size > 0);
    });
    matches.forEach(el => { el.classList.add("hit"); highlight(el, q); });
    if (matches.length === 0) {
      resultEl.className = "result none"; resultEl.style.display = "block";
      resultName.textContent = `No guest found for "${raw.trim()}"`;
      resultTable.textContent = "";
      resultCompanions.textContent = "Please check the spelling or ask an usher.";
    } else if (matches.length === 1) {
      const el = matches[0];
      const tableNo = Number(el.closest(".table-block").dataset.table);
      const info = findGuest(el.dataset.name) || { guests: [] };
      resultEl.className = "result"; resultEl.style.display = "block";
      resultName.textContent = el.textContent;
      resultTable.textContent = `You're at Table ${tableNo}`;
      const others = info.guests.filter(g => norm(g) !== el.dataset.name);
      resultCompanions.textContent = others.length ? "Seated with: " + others.join(", ") : "";
    } else {
      resultEl.className = "result"; resultEl.style.display = "block";
      resultName.textContent = `${matches.length} matches`;
      resultTable.textContent = matchTables.size === 1
        ? `All at Table ${[...matchTables][0]}`
        : `Across Tables ${[...matchTables].sort((a,b)=>a-b).join(", ")}`;
      resultCompanions.textContent = "Keep typing to narrow it down.";
    }
  }
  searchEl.addEventListener("input", onSearch);
  clearEl.addEventListener("click", () => { searchEl.value = ""; searchEl.focus(); onSearch(); });

  const modalOverlay = document.getElementById("modalOverlay");
  document.getElementById("qrFab").addEventListener("click", () => {
    const url = window.location.href.split("?")[0];
    const qrBox = document.getElementById("qrcode");
    document.getElementById("qrUrl").textContent = url;
    try {
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      qrBox.innerHTML = qr.createImgTag(6, 8);
    } catch (e) { qrBox.textContent = "Unable to render QR (no internet?)."; }
    modalOverlay.classList.add("open");
  });
  document.getElementById("modalClose").addEventListener("click", () => modalOverlay.classList.remove("open"));
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove("open"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") modalOverlay.classList.remove("open"); });
</script>
</body>
</html>
