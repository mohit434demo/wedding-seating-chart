<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Olivia &amp; Wilson — Find Your Seat</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --cp-bg: #f7f4ef;
    --cp-bg-elevated: #fcfbf8;
    --cp-surface: #ffffff;
    --cp-surface-soft: #f5f5f5;
    --cp-border: #dedede;
    --cp-border-strong: #919191;
    --cp-text: #242424;
    --cp-text-muted: #5c5c5c;
    --cp-text-soft: #6f6f6f;
    --cp-accent: #b11f4b;
    --cp-accent-hover: #9a1a41;
    --cp-accent-soft: rgba(177, 31, 75, 0.08);
    --cp-accent-fg: #ffffff;
    --cp-success: #16a34a;
    --cp-danger: #dc2626;
    --cp-warning: #f59e0b;
    --cp-link: #0078d4;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
    --cp-overlay: rgba(255, 255, 255, 0.8);
    --cp-panel: rgba(255, 255, 255, 0.86);
    --cp-panel-strong: rgba(255, 255, 255, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.55);
    --cp-highlight: rgba(177, 31, 75, 0.12);

    /* Wedding palette */
    --w-paper: #ffffff;
    --w-ink: #2b2b2b;
    --w-sub: #555;
    --w-green: #7fa06b;
    --w-green-deep: #5f7d4f;
    --w-green-soft: #eef3e8;
    --w-line: #e7e4dc;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #3d3b3a;
    --cp-bg-elevated: #343231;
    --cp-surface: #292929;
    --cp-surface-soft: #2e2e2e;
    --cp-border: #474747;
    --cp-border-strong: #5f5f5f;
    --cp-text: #dedede;
    --cp-text-muted: #919191;
    --cp-text-soft: #b0b0b0;
    --cp-accent: #fd8ea1;
    --cp-accent-hover: #fb7b91;
    --cp-accent-soft: rgba(253, 142, 161, 0.14);
    --cp-accent-fg: #1a1a1a;
    --cp-success: #4ade80;
    --cp-danger: #f87171;
    --cp-warning: #fbbf24;
    --cp-link: #4da6ff;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
    --cp-overlay: rgba(41, 41, 41, 0.88);
    --cp-panel: rgba(41, 41, 41, 0.72);
    --cp-panel-strong: rgba(41, 41, 41, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.04);
    --cp-highlight: rgba(253, 142, 161, 0.12);

    --w-paper: #232322;
    --w-ink: #ece9e2;
    --w-sub: #b3afa6;
    --w-green: #9dbb86;
    --w-green-deep: #b6cfa3;
    --w-green-soft: rgba(157, 187, 134, 0.12);
    --w-line: #3a3a38;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Cormorant Garamond", "Segoe UI", Georgia, serif;
    background: var(--cp-bg);
    color: var(--w-ink);
    -webkit-font-smoothing: antialiased;
    padding: 24px 14px 96px;
  }

  .card {
    max-width: 900px;
    margin: 0 auto;
    background: var(--w-paper);
    border: 1px solid var(--w-line);
    border-radius: 16px;
    box-shadow: var(--cp-shadow);
    padding: 40px 28px 56px;
    position: relative;
    overflow: hidden;
  }

  /* Botanical corners */
  .leaf {
    position: absolute;
    width: 190px;
    height: auto;
    opacity: 0.9;
    pointer-events: none;
    z-index: 0;
  }
  .leaf.bl { bottom: -10px; left: -18px; transform: scaleX(1); }
  .leaf.br { bottom: -10px; right: -18px; transform: scaleX(-1); }
  @media (max-width: 560px) { .leaf { width: 120px; } }

  header { text-align: center; position: relative; z-index: 1; }
  .welcome {
    font-family: "Great Vibes", cursive;
    font-size: clamp(3.4rem, 11vw, 6rem);
    line-height: 0.9;
    color: var(--w-ink);
    margin: 0 0 6px;
    font-weight: 400;
  }
  .to-wedding {
    letter-spacing: 0.32em;
    font-size: clamp(0.8rem, 2.6vw, 1rem);
    font-weight: 600;
    text-transform: uppercase;
    color: var(--w-sub);
    margin: 6px 0 4px;
  }
  .couple {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: clamp(1.6rem, 6vw, 2.7rem);
    margin: 2px 0 2px;
    color: var(--w-ink);
  }
  .find-seat {
    font-family: "Parisienne", cursive;
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    color: var(--w-green-deep);
    margin: 0 0 22px;
  }

  /* Search */
  .search-wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto 8px; }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--cp-surface);
    border: 1.5px solid var(--w-green);
    border-radius: 999px;
    padding: 12px 18px;
    box-shadow: 0 4px 14px rgba(127,160,107,0.14);
  }
  .search-box svg { flex: 0 0 auto; color: var(--w-green-deep); }
  .search-box input {
    border: 0; outline: 0; background: transparent;
    font-family: "Cormorant Garamond", serif;
    font-size: 1.25rem; width: 100%; color: var(--w-ink);
  }
  .search-box input::placeholder { color: var(--w-sub); opacity: 0.8; }
  .clear-btn {
    border: 0; background: transparent; cursor: pointer;
    color: var(--w-sub); font-size: 1.4rem; line-height: 1;
    padding: 0 2px; display: none;
  }

  .result {
    max-width: 520px; margin: 12px auto 0; z-index: 1; position: relative;
    display: none;
  }
  .result-inner {
    background: var(--w-green-soft);
    border: 1px solid var(--w-green);
    border-radius: 14px;
    padding: 16px 20px;
    text-align: center;
  }
  .result-name { font-size: 1.5rem; font-weight: 600; color: var(--w-ink); }
  .result-table {
    font-family: "Parisienne", cursive;
    font-size: 1.9rem; color: var(--w-green-deep); margin-top: 2px;
  }
  .result.none .result-inner {
    background: var(--cp-surface-soft);
    border-color: var(--w-line);
    color: var(--w-sub);
  }
  .result .companions {
    margin-top: 8px; font-size: 1.05rem; color: var(--w-sub);
  }

  .divider {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin: 30px auto 24px; max-width: 320px; color: var(--w-green);
    position: relative; z-index: 1;
  }
  .divider::before, .divider::after {
    content: ""; height: 1px; background: var(--w-line); flex: 1;
  }

  /* Tables grid */
  .tables {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px 20px;
    position: relative; z-index: 1;
  }
  @media (max-width: 680px) { .tables { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .tables { grid-template-columns: 1fr; } }

  .table-block { text-align: center; border-radius: 12px; padding: 8px 6px; transition: background .25s, box-shadow .25s; }
  .table-block.dim { opacity: 0.28; }
  .table-block.match {
    background: var(--w-green-soft);
    box-shadow: 0 0 0 1.5px var(--w-green);
  }
  .table-title {
    font-family: "Parisienne", cursive;
    font-size: 1.7rem; color: var(--w-ink); margin-bottom: 6px;
  }
  .guest {
    font-size: 1.12rem; color: var(--w-ink); line-height: 1.5;
  }
  .guest.hit { color: var(--w-green-deep); font-weight: 600; }
  mark { background: rgba(127,160,107,0.32); color: inherit; padding: 0 2px; border-radius: 3px; }

  /* QR button + modal */
  .qr-fab {
    position: fixed; bottom: 20px; right: 20px; z-index: 20;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--w-green-deep); color: #fff;
    border: 0; border-radius: 999px; cursor: pointer;
    padding: 12px 18px; font-family: "Cormorant Garamond", serif;
    font-size: 1.05rem; font-weight: 600; letter-spacing: .02em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  }
  .qr-fab:hover { background: var(--w-green); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 30;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--w-paper); color: var(--w-ink);
    border-radius: 16px; max-width: 360px; width: 100%;
    padding: 26px 26px 22px; text-align: center;
    box-shadow: var(--cp-shadow); position: relative;
  }
  .modal h3 {
    font-family: "Parisienne", cursive; font-weight: 400;
    font-size: 1.9rem; margin: 0 0 4px; color: var(--w-green-deep);
  }
  .modal p { color: var(--w-sub); font-size: 1.02rem; margin: 0 0 16px; }
  #qrcode { display: flex; justify-content: center; }
  #qrcode img { width: 220px; height: 220px; border-radius: 10px; border: 1px solid var(--w-line); }
  .modal .url {
    margin-top: 14px; font-size: 0.82rem; color: var(--w-sub);
    word-break: break-all; font-family: Consolas, monospace;
  }
  .modal-close {
    position: absolute; top: 10px; right: 12px; border: 0; background: transparent;
    font-size: 1.5rem; cursor: pointer; color: var(--w-sub); line-height: 1;
  }
  .modal .hint { font-size: 0.8rem; color: var(--w-sub); margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <svg class="leaf bl" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="var(--w-green-deep)" stroke-width="1.4" fill="none">
        <path d="M20 150 C 55 120, 80 90, 95 45" />
        <path d="M55 150 C 80 125, 100 100, 120 60" />
        <path d="M95 150 C 110 128, 128 110, 150 80" />
      </g>
      <g fill="var(--w-green)">
        <ellipse cx="95" cy="42" rx="12" ry="8" transform="rotate(-35 95 42)"/>
        <ellipse cx="80" cy="64" rx="13" ry="9" transform="rotate(-20 80 64)"/>
        <ellipse cx="66" cy="90" rx="13" ry="9" transform="rotate(-10 66 90)"/>
        <ellipse cx="120" cy="58" rx="12" ry="8" transform="rotate(-45 120 58)"/>
        <ellipse cx="108" cy="82" rx="13" ry="9" transform="rotate(-30 108 82)"/>
        <ellipse cx="95" cy="108" rx="13" ry="9" transform="rotate(-15 95 108)"/>
        <ellipse cx="150" cy="78" rx="12" ry="8" transform="rotate(-50 150 78)"/>
        <ellipse cx="138" cy="102" rx="13" ry="9" transform="rotate(-35 138 102)"/>
        <ellipse cx="126" cy="126" rx="13" ry="9" transform="rotate(-20 126 126)"/>
        <ellipse cx="50" cy="120" rx="12" ry="8" transform="rotate(5 50 120)"/>
        <ellipse cx="38" cy="140" rx="12" ry="8" transform="rotate(15 38 140)"/>
      </g>
    </svg>
    <svg class="leaf br" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="var(--w-green-deep)" stroke-width="1.4" fill="none">
        <path d="M20 150 C 55 120, 80 90, 95 45" />
        <path d="M55 150 C 80 125, 100 100, 120 60" />
        <path d="M95 150 C 110 128, 128 110, 150 80" />
      </g>
      <g fill="var(--w-green)">
        <ellipse cx="95" cy="42" rx="12" ry="8" transform="rotate(-35 95 42)"/>
        <ellipse cx="80" cy="64" rx="13" ry="9" transform="rotate(-20 80 64)"/>
        <ellipse cx="66" cy="90" rx="13" ry="9" transform="rotate(-10 66 90)"/>
        <ellipse cx="120" cy="58" rx="12" ry="8" transform="rotate(-45 120 58)"/>
        <ellipse cx="108" cy="82" rx="13" ry="9" transform="rotate(-30 108 82)"/>
        <ellipse cx="95" cy="108" rx="13" ry="9" transform="rotate(-15 95 108)"/>
        <ellipse cx="150" cy="78" rx="12" ry="8" transform="rotate(-50 150 78)"/>
        <ellipse cx="138" cy="102" rx="13" ry="9" transform="rotate(-35 138 102)"/>
        <ellipse cx="126" cy="126" rx="13" ry="9" transform="rotate(-20 126 126)"/>
        <ellipse cx="50" cy="120" rx="12" ry="8" transform="rotate(5 50 120)"/>
        <ellipse cx="38" cy="140" rx="12" ry="8" transform="rotate(15 38 140)"/>
      </g>
    </svg>

    <header>
      <h1 class="welcome">Welcome</h1>
      <div class="to-wedding">To the wedding of</div>
      <div class="couple">Olivia &amp; Wilson</div>
      <div class="find-seat">please find your seat</div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search" type="text" placeholder="Type your name to find your table..." autocomplete="off" spellcheck="false" />
        <button class="clear-btn" id="clear" aria-label="Clear">&times;</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="result-inner">
        <div class="result-name" id="resultName"></div>
        <div class="result-table" id="resultTable"></div>
        <div class="companions" id="resultCompanions"></div>
      </div>
    </div>

    <div class="divider">&#10047;</div>

    <div class="tables" id="tables"></div>
  </div>

  <button class="qr-fab" id="qrFab">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm11-2h2v2h-2v-2zm2 2h3v2h-3v-2zm-2 2h2v2h-2v-2zm2 2h3v3h-2v-1h-1v-2zm-4 0h2v3h-2v-3z"/></svg>
    Show QR code
  </button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <h3>Scan to find your seat</h3>
      <p>Point your phone camera here to open this seating chart.</p>
      <div id="qrcode"></div>
      <div class="url" id="qrUrl"></div>
      <div class="hint">Tip: host this page online, then reopen to get a shareable QR.</div>
    </div>
  </div>

<script>
  // ---- Guest data (dummy names) ----
  const TABLES = [
    { n: 1, guests: ["Paul Nolan","Steven McLean","Madeleine Manning","Olivia Graham","Carolyn Kelly","Justin Jones"] },
    { n: 2, guests: ["Jed Sparks","Anne Vargas","Lorene Rollins","Carter Jackson","Marcelino Beasley","Erick Fleming"] },
    { n: 3, guests: ["Tasha Morse","David Odonnell","Pearl Mullins","Therese Paul","Tobias Sweeney","Alyce Ramirez"] },
    { n: 4, guests: ["Jeri Tucker","Natalia Carter","Cherry David","Fay Parker","Margarito Andrade","Brenton Booth"] },
    { n: 5, guests: ["Young Levy","Terry Mann","Virgilio Estes","Stacie Benson","Antony Owen","Richie Hart"] },
    { n: 6, guests: ["Lavern Lutz","Salvatore Acosta","Kris Sellers","Cornelia Cooper","Brendan Peck","Sandy Merritt"] },
    { n: 7, guests: ["Hilton Hill","Claudette Graham","Sherry Hopkins","Wallace Russo","Latoya Lee","Henry Cline"] },
    { n: 8, guests: ["Ginger Johns","Lewis Baldwin","Allison Burch","Katy Bailey","Kerri Matthews","Kendra Ponce"] },
    { n: 9, guests: ["Monte Lin","Lynn Frost","Pamela Cooke","Mack Figueroa","Benedict Zimmerman","Pansy Novak","Orville Guerra"] },
  ];

  const ordinal = (n) => ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"][n] || n;
  const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();

  // Build the grid
  const tablesEl = document.getElementById("tables");
  TABLES.forEach(t => {
    const block = document.createElement("div");
    block.className = "table-block";
    block.dataset.table = t.n;
    let html = `<div class="table-title">Table ${t.n}</div>`;
    t.guests.forEach(g => {
      html += `<div class="guest" data-name="${norm(g)}">${g}</div>`;
    });
    block.innerHTML = html;
    tablesEl.appendChild(block);
  });

  const guestEls = Array.from(document.querySelectorAll(".guest"));
  const blockEls = Array.from(document.querySelectorAll(".table-block"));

  const searchEl = document.getElementById("search");
  const clearEl = document.getElementById("clear");
  const resultEl = document.getElementById("result");
  const resultName = document.getElementById("resultName");
  const resultTable = document.getElementById("resultTable");
  const resultCompanions = document.getElementById("resultCompanions");

  function findGuest(name) {
    for (const t of TABLES) {
      for (const g of t.guests) {
        if (norm(g) === name) return { table: t.n, name: g, guests: t.guests };
      }
    }
    return null;
  }

  function reset() {
    guestEls.forEach(el => el.classList.remove("hit"));
    guestEls.forEach(el => { el.innerHTML = el.textContent; });
    blockEls.forEach(el => el.classList.remove("dim", "match"));
    resultEl.className = "result";
    resultEl.style.display = "none";
  }

  function highlight(el, q) {
    const text = el.textContent;
    const i = norm(text).indexOf(q);
    if (i < 0) { el.innerHTML = text; return; }
    el.innerHTML = text.slice(0, i) + "<mark>" + text.slice(i, i + q.length) + "</mark>" + text.slice(i + q.length);
  }

  function onSearch() {
    const raw = searchEl.value;
    const q = norm(raw);
    clearEl.style.display = raw ? "block" : "none";

    if (!q) { reset(); return; }

    // Find all guests matching the query (substring)
    const matches = guestEls.filter(el => el.dataset.name.includes(q));
    const matchTables = new Set(matches.map(el => Number(el.closest(".table-block").dataset.table)));

    // Style grid
    guestEls.forEach(el => {
      el.classList.remove("hit");
      el.innerHTML = el.textContent;
    });
    blockEls.forEach(el => {
      const isMatch = matchTables.has(Number(el.dataset.table));
      el.classList.toggle("match", isMatch);
      el.classList.toggle("dim", !isMatch && matchTables.size > 0);
    });
    matches.forEach(el => { el.classList.add("hit"); highlight(el, q); });

    // Result banner
    if (matches.length === 0) {
      resultEl.className = "result none";
      resultEl.style.display = "block";
      resultName.textContent = `No guest found for "${raw.trim()}"`;
      resultTable.textContent = "";
      resultCompanions.textContent = "Please check the spelling or ask an usher.";
    } else if (matches.length === 1) {
      const el = matches[0];
      const tableNo = Number(el.closest(".table-block").dataset.table);
      const info = findGuest(el.dataset.name) || { guests: [] };
      resultEl.className = "result";
      resultEl.style.display = "block";
      resultName.textContent = el.textContent;
      resultTable.textContent = `You're at Table ${tableNo}`;
      const others = info.guests.filter(g => norm(g) !== el.dataset.name);
      resultCompanions.textContent = others.length ? "Seated with: " + others.join(", ") : "";
    } else {
      resultEl.className = "result";
      resultEl.style.display = "block";
      resultName.textContent = `${matches.length} matches`;
      resultTable.textContent = matchTables.size === 1
        ? `All at Table ${[...matchTables][0]}`
        : `Across Tables ${[...matchTables].sort((a,b)=>a-b).join(", ")}`;
      resultCompanions.textContent = "Keep typing to narrow it down.";
    }
  }

  searchEl.addEventListener("input", onSearch);
  clearEl.addEventListener("click", () => { searchEl.value = ""; searchEl.focus(); onSearch(); });

  // ---- QR code ----
  const modalOverlay = document.getElementById("modalOverlay");
  document.getElementById("qrFab").addEventListener("click", () => {
    const url = window.location.href;
    const qrBox = document.getElementById("qrcode");
    document.getElementById("qrUrl").textContent = url;
    try {
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      qrBox.innerHTML = qr.createImgTag(6, 8);
    } catch (e) {
      qrBox.textContent = "Unable to render QR (no internet?).";
    }
    modalOverlay.classList.add("open");
  });
  document.getElementById("modalClose").addEventListener("click", () => modalOverlay.classList.remove("open"));
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove("open"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") modalOverlay.classList.remove("open"); });
</script>
</body>
</html>
